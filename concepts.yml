context: audit-logs
name: Audit Logs
intro: >-
  The common audit-log vocabulary -- the audit events that record who did what to which
  resource, and the log streams that export them to a SIEM -- distilled from the APIs that
  already exist. Cross-cutting: almost every enterprise API keeps an audit log.
tags: [Compliance, Security, Identity, Authentication, Governance, Audit, Audit Logging, SIEM, Enterprise Software]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url]

common_fields:
  id: [uuid, guid, object_id, record_id, event_id, log_id, audit_id, uuid_event]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, timestamp, time, occurred_at, event_time, datetime, published]
  metadata: [meta_data, custom_fields, custom, attributes, properties, context, details, additional_data]

concepts:
  audit_event:
    path: /audit-events
    segments: [audit_logs, audit-logs, auditlogs, audit_log, audit-log, auditlog, audit_events, audit-events, auditevents, audit_trail, audit-trail, audittrail, "events@audit|audit_logs|audit-logs|security", "logs@audit", "activities@audit|admin", activity_logs, activity-logs]
    aliases:
      action: [event, event_type, type, action_type, operation, event_name, activity, verb, method]
      actor_id: [actor, user_id, user, principal, performed_by, actor_email, initiator, created_by, by, who]
      actor_type: [principal_type, user_type, actor_kind]
      target_id: [target, resource_id, resource, object_id, entity_id, subject, target_resource]
      target_type: [resource_type, object_type, entity_type, target_kind]
      ip_address: [ip, source_ip, client_ip, remote_addr, ip_addr]
      user_agent: [ua, client, client_info]
      outcome: [result, status, success, severity]
      changes: [diff, old_value, new_value, before, after, changes_made]
  # log_stream was measured and dropped: 2 providers expose log sinks as a resource.

duplicates:
  bureau-of-industry-security: [bureau-of-industry-and-security]
  conductorone: [c1]
  oracle-health: [cerner]
  cvent: [cvent-hospitality-cloud, cvent-registration]
  ethena: [goethena]
  lseg: [london-stock-exchange-group]
  moodys: [moodys-corporation]
  viso-trust: [viso-trust-protecht]

findings:
  - "An audit event agrees on the action, the actor, an id and when it happened -- who did what,
    and when -- across 62 providers. The target, the IP address and the outcome sit below core:
    every audit log records the actor and the act, fewer record what was acted on."
  - "Log streams to a SIEM are almost never a resource of their own (2 providers); exporting audit
    logs is configured, not modelled."
decisions:
  - "The cohort is the security, identity, compliance and governance tags: audit logs are part of
    the enterprise surface of almost any API, and these tags find the ones that publish them."
  - "Only audit-specific paths count -- audit logs, audit events, audit trails, activity logs, and
    events or logs beneath an audit path; a bare `/events` or `/logs` is another context's."
  - "Audit events are `/audit-events`."
  - "Duplicates merged: eight listings, including ConductorOne, Oracle Health, Cvent and LSEG."
